name: Printful pending draft audit
on:
  push:
    branches: [crew/printful-api-probe]
    paths:
      - .github/workflows/printful-pending-audit.yml
      - scripts/printful-pending-audit.mjs
      - scripts/printful-pending-audit.test.mjs
permissions:
  contents: read
concurrency:
  group: printful-pending-audit
  cancel-in-progress: false
jobs:
  audit:
    if: github.ref == 'refs/heads/crew/printful-api-probe'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    environment: printful-api-probe
    steps:
      - name: Fetch fixed audit source at this immutable commit
        env:
          AUDIT_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$AUDIT_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          mkdir -p scripts
          for name in printful-pending-audit.mjs printful-pending-audit.test.mjs; do
            curl --fail --silent --show-error --proto '=https' --tlsv1.2 --max-time 30 "https://raw.githubusercontent.com/mrask31/charmedanddark/$AUDIT_COMMIT/scripts/$name" --output "scripts/$name"
          done
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Verify fixed request and credential boundaries without secrets
        run: node --test scripts/printful-pending-audit.test.mjs
      - name: Read pending draft mappings and public blank catalog
        env:
          PRINTFUL_MIGRATION_API_TOKEN: ${{ secrets.PRINTFUL_MIGRATION_API_TOKEN }}
        run: node scripts/printful-pending-audit.mjs
