# Read-only investigation on the dedicated branch; official actions are pinned.
# This branch-only probe neither changes Printful nor publishes Shopify products.
# Configure the environment deployment branch policy to crew/printful-api-probe.
# Merely referencing an environment here does not enforce that policy.
name: Printful read-only API probe

on:
  push:
    branches:
      - crew/printful-api-probe
    paths:
      - .github/workflows/printful-readonly-probe.yml
      - scripts/printful-readonly-probe.mjs
      - scripts/printful-readonly-probe.test.mjs

permissions:
  contents: read

concurrency:
  group: printful-read-only-probe
  cancel-in-progress: true

jobs:
  probe:
    name: Verify minimum read access
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: printful-api-probe
    steps:
      # Official actions/checkout v4 ref, verified by root against GitHub.
      - name: Check out reviewed probe branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      # Official actions/setup-node v4 ref, verified by root against GitHub.
      - name: Set up Node 24 without dependency installation
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Confirm Node runtime
        shell: bash
        run: node -e 'if (Number(process.versions.node.split(".")[0]) < 22) { process.stderr.write("Node 22 or newer is required.\n"); process.exit(1); }'
      - name: Test probe boundaries without secrets
        shell: bash
        run: node --test scripts/printful-readonly-probe.test.mjs
      - name: Read Printful connection status
        shell: bash
        env:
          PRINTFUL_API_TOKEN: ${{ secrets.PRINTFUL_API_TOKEN }}
          PRINTFUL_STORE_ID: ${{ vars.PRINTFUL_STORE_ID }}
        run: node scripts/printful-readonly-probe.mjs
